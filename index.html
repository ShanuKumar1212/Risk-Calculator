
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Risk Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1120;
    color: #e5e7eb;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #f8fafc;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 30px;
}

.calculator {
    background: #151e30;
    border: 1px solid #263449;
    padding: 25px;
    border-radius: 14px;
}

.section-title {
    color: #38bdf8;
    margin-bottom: 20px;
    font-size: 17px;
}

.inputs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
}

.field input {
    width: 100%;
    padding: 13px;
    background: #0b1220;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    outline: none;
}

.field input:focus {
    border-color: #38bdf8;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #0284c7;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0369a1;
}

.results {
    margin-top: 25px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.result-card {
    background: #0b1220;
    border: 1px solid #263449;
    padding: 20px;
    border-radius: 10px;
}

.result-card p {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 12px;
}

.result-card h2 {
    font-size: 25px;
    color: #f8fafc;
    overflow-wrap: anywhere;
}

.green {
    color: #22c55e !important;
}

.red {
    color: #ef4444 !important;
}

.blue {
    color: #38bdf8 !important;
}

.error {
    color: #f87171;
    text-align: center;
    margin-top: 15px;
}

.summary {
    margin-top: 20px;
    padding: 16px;
    border-radius: 9px;
    background: #1e293b;
    line-height: 1.9;
    color: #cbd5e1;
}

@media(max-width: 550px) {
    .inputs, .results {
        grid-template-columns: 1fr;
    }

    .calculator {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Trade Risk Calculator</h1>

    <p class="subtitle">
        Calculate your position size and potential reward.
    </p>

    <div class="calculator">

        <h3 class="section-title">Trade Inputs</h3>

        <div class="inputs">

            <div class="field">
                <label>Buy Price (₹)</label>
                <input type="number" id="buy" placeholder="250" step="any">
            </div>

            <div class="field">
                <label>Stop Loss (₹)</label>
                <input type="number" id="sl" placeholder="240" step="any">
            </div>

            <div class="field">
                <label>Target Price (₹)</label>
                <input type="number" id="target" placeholder="280" step="any">
            </div>

            <div class="field">
                <label>Maximum Loss Per Trade (₹)</label>
                <input type="number" id="maxLoss" placeholder="1000" step="any">
            </div>

        </div>

        <button onclick="calculate()">Calculate Trade</button>

        <p class="error" id="error"></p>

        <h3 class="section-title" style="margin-top:30px;">
            Trade Results
        </h3>

        <div class="results">

            <div class="result-card">
                <p>Quantity of Shares</p>
                <h2 id="quantity" class="blue">--</h2>
            </div>

            <div class="result-card">
                <p>Potential Profit Amount</p>
                <h2 id="profit" class="green">--</h2>
            </div>

            <div class="result-card">
                <p>Maximum Loss Amount</p>
                <h2 id="loss" class="red">--</h2>
            </div>

            <div class="result-card">
                <p>Risk-to-Reward Ratio</p>
                <h2 id="ratio" class="blue">--</h2>
            </div>

        </div>

        <div class="summary" id="summary">
            Enter trade details to calculate your position.
        </div>

    </div>

</div>

<script>

function calculate() {

    const buy = Number(document.getElementById("buy").value);
    const sl = Number(document.getElementById("sl").value);
    const target = Number(document.getElementById("target").value);
    const maxLoss = Number(document.getElementById("maxLoss").value);

    const error = document.getElementById("error");
    error.textContent = "";

    if (
        ![buy, sl, target, maxLoss].every(Number.isFinite) ||
        buy <= 0 || sl <= 0 || target <= 0 || maxLoss <= 0
    ) {
        error.textContent = "Please enter valid positive values.";
        return;
    }

    if (sl >= buy) {
        error.textContent = "Stop loss must be below buy price.";
        return;
    }

    if (target <= buy) {
        error.textContent = "Target must be above buy price.";
        return;
    }

    // Risk and reward per share
    const riskPerShare = buy - sl;
    const rewardPerShare = target - buy;

    // Calculate quantity based on maximum acceptable loss
    const quantity = Math.floor(maxLoss / riskPerShare);

    if (quantity < 1) {
        error.textContent =
            "Maximum loss amount is too small to buy even one share.";
        return;
    }

    // Actual profit and loss based on whole shares
    const actualLoss = quantity * riskPerShare;
    const profit = quantity * rewardPerShare;

    // Risk reward ratio
    const ratio = rewardPerShare / riskPerShare;

    const format = value =>
        "₹" + value.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });

    // Display outputs
    document.getElementById("quantity").textContent = quantity;

    document.getElementById("profit").textContent =
        format(profit);

    document.getElementById("loss").textContent =
        format(actualLoss);

    document.getElementById("ratio").textContent =
        "1 : " + ratio.toFixed(2);

    // Summary
    document.getElementById("summary").innerHTML = `
        <strong>TRADE ANALYSIS</strong><br>

        Buy Price: ${format(buy)}<br>

        Stop Loss: ${format(sl)}<br>

        Target Price: ${format(target)}<br>

        Risk Per Share: ${format(riskPerShare)}<br>

        Reward Per Share: ${format(rewardPerShare)}<br>

        Quantity: <strong>${quantity} shares</strong><br>

        Actual Maximum Loss:
        <strong style="color:#ef4444">${format(actualLoss)}</strong><br>

        Potential Profit:
        <strong style="color:#22c55e">${format(profit)}</strong><br>

        Risk-to-Reward:
        <strong>1 : ${ratio.toFixed(2)}</strong>
    `;
}

</script>

</body>
</html>
